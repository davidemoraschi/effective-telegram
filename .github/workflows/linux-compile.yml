name: Linux Compile Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-linux:
    name: ${{ matrix.compiler }} / ${{ matrix.preset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        preset: [linux-debug, linux-release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang

      - name: Configure
        env:
          CC: ${{ matrix.compiler }}
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Upload binaries
        if: matrix.compiler == 'gcc' && matrix.preset == 'linux-release'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: linux-release-bins
          path: out/build/linux-release/bin/

  test-linux:
    name: Run tester
    runs-on: ubuntu-latest
    needs: build-linux

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4.3.0
        with:
          name: linux-release-bins
          path: bin

      - name: Run tester
        run: |
          chmod +x bin/sqlite-mcp bin/sqlite-mcp-tool-tester
          bin/sqlite-mcp-tool-tester bin/sqlite-mcp /tmp/test.db 1 1
